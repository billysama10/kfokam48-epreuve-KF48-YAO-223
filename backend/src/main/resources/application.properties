spring.application.name=presences

# Base H2 en mode fichier (dossier data/, ignoré par Git)
spring.datasource.url=jdbc:h2:file:./data/kf48;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Schéma géré uniquement par Flyway (B5) ; Hibernate se contente de vérifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# Dates en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# Jamais de stack trace ni de page d'erreur par défaut (B4)
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
spring.mvc.problemdetails.enabled=false
